name: Deploy to GitHub Pages

# เว็บเดโมแบบ static บน GitHub Pages
# หมายเหตุ: Pages เสิร์ฟไฟล์นิ่งอย่างเดียว ไม่มี serverless function
# → /api/chat จะไม่มีบนนี้ ผู้ช่วย AI จะทำงานในโหมด localAnswer() เสมอ
# ถ้าต้องการให้ AI ต่อโมเดลจริง ให้ใช้เว็บบน Netlify แทน

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ให้ deploy ทีละชุด ไม่ยกเลิกชุดที่กำลังรันอยู่
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build
        # ตัวแปรนี้คือสิ่งที่ทำให้ vite ตั้ง base เป็น /southern_zero_dropout/
        env:
          GITHUB_PAGES: 'true'
        run: npm run build
      - name: SPA fallback
        # React Router จัดการ route ฝั่ง client — ถ้าเปิด /student ตรง ๆ
        # Pages จะหาไฟล์ไม่เจอแล้วคืน 404.html ซึ่งเราทำให้เป็นหน้าแอปเดียวกัน
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
